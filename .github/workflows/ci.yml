name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  build-images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [ingest_indeed, ingest_linkedin, process_worker, ai_api, referral_api, app_api]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: |
          name=$(echo "${{ matrix.service }}" | tr '_' '-')
          docker build -t code-kitchen/${name}:ci -f services/${{ matrix.service }}/Dockerfile .

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t code-kitchen/web:ci -f web/Dockerfile .
